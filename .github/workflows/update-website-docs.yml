name: Update Website Docs

on:
  push:
    branches:
      - stable

jobs:
  update-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Database repo
        uses: actions/checkout@v4
        with:
          path: Database

      - name: Checkout Website repo
        uses: actions/checkout@v4
        with:
          repository: Dumpstarr/dumpstarr-website
          token: ${{ secrets.WEBSITE_PUSH_TOKEN }}
          path: dumpstarr-website

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate documentation
        env:
          DATABASE_REPO_PATH: ${{ github.workspace }}/Database
        run: python3 dumpstarr-website/scripts/generate_docs.py

      - name: Commit and push if changed
        working-directory: dumpstarr-website
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          DB_SHA=$(git -C ../Database rev-parse --short HEAD)
          git commit -m "docs: refresh database documentation from Database@${DB_SHA}"
          git push
